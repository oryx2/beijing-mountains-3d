<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>北京山川地形</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1220; font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: #e8eef8; }
    #canvas-wrap { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 16px 20px; pointer-events: none;
      background: linear-gradient(180deg, rgba(8,14,28,0.75) 0%, rgba(8,14,28,0) 100%);
    }
    header h1 { font-size: clamp(1.1rem, 2.5vw, 1.5rem); font-weight: 600; letter-spacing: 0.04em; }
    header p { margin-top: 4px; font-size: 0.8rem; opacity: 0.7; }
    #hud {
      position: fixed; right: 16px; bottom: 16px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    button {
      pointer-events: auto; border: 1px solid rgba(255,255,255,0.22);
      background: rgba(16, 28, 48, 0.82); color: #e8eef8;
      border-radius: 10px; padding: 10px 14px; font-size: 0.85rem;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    button:hover { background: rgba(36, 58, 92, 0.9); }
    #legend {
      pointer-events: none;
      background: rgba(16, 28, 48, 0.82); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px; padding: 10px 12px; font-size: 0.72rem; line-height: 1.35;
      backdrop-filter: blur(8px); min-width: 148px;
    }
    #legend .title { opacity: 0.75; margin-bottom: 6px; }
    #legend .swatch {
      height: 10px; border-radius: 999px; margin-bottom: 6px;
      background: linear-gradient(90deg,
        #2a6fb5 0%, #5aa06a 12%, #c4b46a 28%, #b07a3a 48%,
        #8a6a4a 68%, #9a9a9a 85%, #f2f4f8 100%);
    }
    #legend .row { display: flex; justify-content: space-between; opacity: 0.8; }
    #status {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 5; text-align: center; pointer-events: none;
      background: rgba(8,14,28,0.72); padding: 18px 22px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12); min-width: 220px;
    }
    #status.hidden { display: none; }
    .bar {
      margin-top: 12px; height: 6px; border-radius: 999px; overflow: hidden;
      background: rgba(255,255,255,0.12);
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #5b9cff, #7ed0a7);
      transition: width 0.15s ease;
    }
    #hint {
      position: fixed; left: 16px; bottom: 16px; z-index: 10;
      font-size: 0.75rem; opacity: 0.55; max-width: 260px; line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>北京山川地形</h1>
    <p>北京市域边界 · 西山 / 军都山 · Copernicus DEM · 高度着色 · 拖动旋转 · 滚轮缩放</p>
  </header>
  <div id="canvas-wrap"></div>
  <div id="status">
    <div id="status-text">正在加载地形…</div>
    <div class="bar"><i id="progress"></i></div>
  </div>
  <div id="hud">
    <div id="legend">
      <div class="title">海拔着色</div>
      <div class="swatch"></div>
      <div class="row"><span>平原 / 河</span><span>高山</span></div>
    </div>
    <button id="btn-reset" type="button" title="重置视角">重置视角</button>
  </div>
  <div id="hint">左键旋转 · 右键平移 · 滚轮缩放</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const wrap = document.getElementById("canvas-wrap");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("status-text");
    const progressEl = document.getElementById("progress");
    const btnReset = document.getElementById("btn-reset");

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7eb6e8);
    scene.fog = new THREE.Fog(0x7eb6e8, 1800, 5200);

    const hemi = new THREE.HemisphereLight(0xd8ecff, 0x5a6a40, 0.95);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff0d2, 1.55);
    sun.position.set(600, 900, 400);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xa8c4ff, 0.4);
    fill.position.set(-500, 300, -600);
    scene.add(fill);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 20000);
    camera.position.set(900, 650, 900);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 80;
    controls.maxDistance = 4500;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 20, 0);

    let defaultCam = camera.position.clone();
    let defaultTarget = controls.target.clone();

    function fitCameraToObject(root) {
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 0.95;
      camera.near = Math.max(0.1, maxDim / 500);
      camera.far = maxDim * 20;
      camera.updateProjectionMatrix();
      camera.position.set(center.x + dist * 0.75, center.y + dist * 0.55, center.z + dist * 0.75);
      controls.target.copy(center);
      controls.minDistance = maxDim * 0.05;
      controls.maxDistance = maxDim * 4;
      controls.update();
      defaultCam = camera.position.clone();
      defaultTarget = controls.target.clone();
      scene.fog.near = maxDim * 0.9;
      scene.fog.far = maxDim * 3.2;
    }

    btnReset.addEventListener("click", () => {
      camera.position.copy(defaultCam);
      controls.target.copy(defaultTarget);
      controls.update();
    });

    // Height stops in meters (approx Beijing DEM); mesh Y = (h - z_floor) * z_exag * 0.01
    // We color by relative Y within the terrain mesh so it stays correct even if scale changes.
    const HEIGHT_STOPS = [
      { t: 0.00, c: new THREE.Color(0x2a6fb5) }, // very low / water-ish
      { t: 0.06, c: new THREE.Color(0x4a9a6a) }, // low plains green
      { t: 0.14, c: new THREE.Color(0x8fbf6a) }, // plains
      { t: 0.28, c: new THREE.Color(0xc4b46a) }, // foothills tan
      { t: 0.45, c: new THREE.Color(0xb07a3a) }, // mid hills brown
      { t: 0.62, c: new THREE.Color(0x8a6a4a) }, // high hills
      { t: 0.78, c: new THREE.Color(0x8e8e8e) }, // rock gray
      { t: 0.90, c: new THREE.Color(0xc8c8c8) }, // high peaks
      { t: 1.00, c: new THREE.Color(0xf2f4f8) }, // snow / summit
    ];

    function sampleHeightColor(t, out) {
      const x = Math.min(1, Math.max(0, t));
      let i = 0;
      while (i < HEIGHT_STOPS.length - 2 && HEIGHT_STOPS[i + 1].t < x) i++;
      const a = HEIGHT_STOPS[i];
      const b = HEIGHT_STOPS[i + 1];
      const u = (x - a.t) / Math.max(1e-6, b.t - a.t);
      return out.copy(a.c).lerp(b.c, u);
    }

    function applyHeightColors(mesh) {
      const geom = mesh.geometry;
      const pos = geom.attributes.position;
      if (!pos) return;

      // Use world Y after mesh matrix (glTF Y-up = elevation)
      mesh.updateWorldMatrix(true, false);
      const e = mesh.matrixWorld.elements;
      // worldY = e1*x + e5*y + e9*z + e13
      let yMin = Infinity, yMax = -Infinity;
      const ys = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const wy = e[1] * x + e[5] * y + e[9] * z + e[13];
        ys[i] = wy;
        if (wy < yMin) yMin = wy;
        if (wy > yMax) yMax = wy;
      }
      // Ignore extreme flat floor if present: use 2nd–98th percentile-ish via clamp on span
      const span = Math.max(1e-4, yMax - yMin);
      // Soft-power curve so plains/hills separate more (most Beijing area is low)
      const colors = new Float32Array(pos.count * 3);
      const tmp = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        let t = (ys[i] - yMin) / span;
        // emphasize mid/high: gamma < 1 stretches lows less, highs more visible
        t = Math.pow(t, 0.72);
        sampleHeightColor(t, tmp);
        colors[i * 3] = tmp.r;
        colors[i * 3 + 1] = tmp.g;
        colors[i * 3 + 2] = tmp.b;
      }
      geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.88,
        metalness: 0.02,
        flatShading: false,
        side: THREE.FrontSide,
      });
      if (mesh.material && !Array.isArray(mesh.material)) {
        mesh.material.dispose?.();
      }
      mesh.material = mat;
    }

    const loader = new GLTFLoader();
    try {
      await MeshoptDecoder.ready;
      loader.setMeshoptDecoder(MeshoptDecoder);
    } catch (e) {
      console.warn("MeshoptDecoder unavailable", e);
    }
    loader.load(
      "./beijing_mountains.glb",
      (gltf) => {
        const root = gltf.scene;
        root.traverse((obj) => {
          if (!obj.isMesh) return;
          obj.castShadow = false;
          obj.receiveShadow = false;
          const name = `${obj.name || ""} ${obj.material?.name || ""}`;
          if (/river/i.test(name)) {
            obj.position.y += 0.4;
            const riverMat = new THREE.MeshStandardMaterial({
              color: 0x2f6fb8,
              roughness: 0.35,
              metalness: 0.05,
              emissive: 0x123a66,
              emissiveIntensity: 0.35,
              side: THREE.DoubleSide,
            });
            if (obj.material && !Array.isArray(obj.material)) obj.material.dispose?.();
            obj.material = riverMat;
            return;
          }
          applyHeightColors(obj);
        });
        scene.add(root);
        fitCameraToObject(root);
        statusEl.classList.add("hidden");
      },
      (ev) => {
        if (ev.total > 0) {
          const pct = Math.round((ev.loaded / ev.total) * 100);
          progressEl.style.width = pct + "%";
          statusText.textContent = `正在加载地形… ${pct}%`;
        } else {
          statusText.textContent = `正在加载地形… ${(ev.loaded / 1048576).toFixed(1)} MB`;
        }
      },
      (err) => {
        console.error(err);
        const viaFile = location.protocol === "file:";
        statusText.textContent = viaFile
          ? "加载失败：请用本地 HTTP 打开（不要直接双击文件）"
          : "地形模型加载失败（网络或文件缺失）。请刷新或改用本机服务。";
        progressEl.style.width = "100%";
        progressEl.style.background = "#c44";
      }
    );

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener("resize", onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
