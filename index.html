<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>北京山川地形</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1220; font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: #e8eef8; }
    #canvas-wrap { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 16px 20px; pointer-events: none;
      background: linear-gradient(180deg, rgba(8,14,28,0.75) 0%, rgba(8,14,28,0) 100%);
    }
    header h1 { font-size: clamp(1.1rem, 2.5vw, 1.5rem); font-weight: 600; letter-spacing: 0.04em; }
    header p { margin-top: 4px; font-size: 0.8rem; opacity: 0.7; }
    #hud {
      position: fixed; right: 16px; bottom: 16px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    button {
      pointer-events: auto; border: 1px solid rgba(255,255,255,0.22);
      background: rgba(16, 28, 48, 0.82); color: #e8eef8;
      border-radius: 10px; padding: 10px 14px; font-size: 0.85rem;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    button:hover { background: rgba(36, 58, 92, 0.9); }
    #legend {
      pointer-events: none;
      background: rgba(16, 28, 48, 0.82); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px; padding: 10px 12px; font-size: 0.72rem; line-height: 1.35;
      backdrop-filter: blur(8px); min-width: 148px;
    }
    #legend .title { opacity: 0.75; margin-bottom: 6px; }
    #legend .swatch {
      height: 10px; border-radius: 999px; margin-bottom: 6px;
      background: linear-gradient(90deg,
        #2a6fb5 0%, #5aa06a 12%, #c4b46a 28%, #b07a3a 48%,
        #8a6a4a 68%, #9a9a9a 85%, #f2f4f8 100%);
    }
    #legend .row { display: flex; justify-content: space-between; opacity: 0.8; }
    #legend .water {
      margin-top: 8px; display: flex; align-items: center; gap: 8px; opacity: 0.9;
    }
    #legend .water i {
      width: 18px; height: 4px; border-radius: 2px; background: #3a8fd4;
      box-shadow: 0 0 6px rgba(58,143,212,0.6);
    }
    #status {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 5; text-align: center; pointer-events: none;
      background: rgba(8,14,28,0.72); padding: 18px 22px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12); min-width: 220px;
    }
    #status.hidden { display: none; }
    .bar {
      margin-top: 12px; height: 6px; border-radius: 999px; overflow: hidden;
      background: rgba(255,255,255,0.12);
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #5b9cff, #7ed0a7);
      transition: width 0.15s ease;
    }

    .geo-label {
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      padding: 2px 8px;
      border-radius: 999px;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0.02em;
      box-shadow: 0 1px 4px rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.14);
      transform: translate(-50%, -100%);
      line-height: 1.35;
    }
    .geo-label.district {
      font-size: 11px;
      font-weight: 500;
      color: rgba(236, 242, 252, 0.92);
      background: rgba(12, 22, 40, 0.62);
    }
    .geo-label.mountain {
      font-size: 12px;
      font-weight: 650;
      color: #fff8ef;
      background: rgba(28, 22, 14, 0.78);
      border-color: rgba(255, 210, 150, 0.28);
    }
    .geo-label.lake, .geo-label.river {
      font-size: 11px;
      font-weight: 560;
      color: #e6f4ff;
      background: rgba(8, 36, 64, 0.78);
      border-color: rgba(120, 190, 255, 0.35);
    }
    .geo-label.river { font-weight: 500; opacity: 0.95; }
    #hint {
      position: fixed; left: 16px; bottom: 16px; z-index: 10;
      font-size: 0.75rem; opacity: 0.55; max-width: 280px; line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>北京山川地形</h1>
    <p>北京市域 · 区界 · 区县 / 名山 / 湖河标注 · 高度夸张 · 拖动旋转 · 滚轮缩放</p>
  </header>
  <div id="canvas-wrap"></div>
  <div id="status">
    <div id="status-text">正在加载地形…</div>
    <div class="bar"><i id="progress"></i></div>
  </div>
  <div id="hud">
    <div id="legend">
      <div class="title">海拔着色</div>
      <div class="swatch"></div>
      <div class="row"><span>平原 / 河</span><span>高山</span></div>
      <div class="water"><i></i><span>主要湖河</span></div>
      <div class="water" style="margin-top:4px;opacity:0.85">
        <i style="background:#d8e0ec;box-shadow:none;opacity:0.85"></i><span>行政区界</span>
      </div>
      <div class="water" style="margin-top:4px;opacity:0.75"><span>区县 · 名山 · 湖河标注</span></div>
    </div>
    <button id="btn-reset" type="button" title="重置视角">重置视角</button>
  </div>
  <div id="hint">左键旋转 · 右键平移 · 滚轮缩放<br/>山高已夸张 · 区界 + 标注：区县 / 山 / 湖河</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

    // Mesh already has z_exaggeration ≈ 2.0; boost Y → ~5.5× total
    const VERTICAL_BOOST = 2.75;
    const WATER_LIFT_FRAC = 0.004; // relative to terrain span

    const wrap = document.getElementById("canvas-wrap");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("status-text");
    const progressEl = document.getElementById("progress");
    const btnReset = document.getElementById("btn-reset");

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    wrap.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = "absolute";
    labelRenderer.domElement.style.inset = "0";
    labelRenderer.domElement.style.pointerEvents = "none";
    wrap.appendChild(labelRenderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7eb6e8);
    scene.fog = new THREE.Fog(0x7eb6e8, 1800, 5200);

    scene.add(new THREE.HemisphereLight(0xd8ecff, 0x5a6a40, 0.95));
    const sun = new THREE.DirectionalLight(0xfff0d2, 1.55);
    sun.position.set(600, 900, 400);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xa8c4ff, 0.4);
    fill.position.set(-500, 300, -600);
    scene.add(fill);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 20000);
    camera.position.set(900, 650, 900);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 80;
    controls.maxDistance = 4500;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 20, 0);

    let defaultCam = camera.position.clone();
    let defaultTarget = controls.target.clone();

    function fitCameraToObject(root) {
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 0.95;
      camera.near = Math.max(0.1, maxDim / 500);
      camera.far = maxDim * 20;
      camera.updateProjectionMatrix();
      camera.position.set(center.x + dist * 0.72, center.y + dist * 0.72, center.z + dist * 0.72);
      controls.target.set(center.x, center.y + size.y * 0.08, center.z);
      controls.minDistance = maxDim * 0.05;
      controls.maxDistance = maxDim * 4;
      controls.update();
      defaultCam = camera.position.clone();
      defaultTarget = controls.target.clone();
      scene.fog.near = maxDim * 0.9;
      scene.fog.far = maxDim * 3.2;
    }

    btnReset.addEventListener("click", () => {
      camera.position.copy(defaultCam);
      controls.target.copy(defaultTarget);
      controls.update();
    });

    const HEIGHT_STOPS = [
      { t: 0.00, c: new THREE.Color(0x2a6fb5) },
      { t: 0.06, c: new THREE.Color(0x4a9a6a) },
      { t: 0.14, c: new THREE.Color(0x8fbf6a) },
      { t: 0.28, c: new THREE.Color(0xc4b46a) },
      { t: 0.45, c: new THREE.Color(0xb07a3a) },
      { t: 0.62, c: new THREE.Color(0x8a6a4a) },
      { t: 0.78, c: new THREE.Color(0x8e8e8e) },
      { t: 0.90, c: new THREE.Color(0xc8c8c8) },
      { t: 1.00, c: new THREE.Color(0xf2f4f8) },
    ];

    function sampleHeightColor(t, out) {
      const x = Math.min(1, Math.max(0, t));
      let i = 0;
      while (i < HEIGHT_STOPS.length - 2 && HEIGHT_STOPS[i + 1].t < x) i++;
      const a = HEIGHT_STOPS[i];
      const b = HEIGHT_STOPS[i + 1];
      const u = (x - a.t) / Math.max(1e-6, b.t - a.t);
      return out.copy(a.c).lerp(b.c, u);
    }

    function applyHeightColors(mesh) {
      const geom = mesh.geometry;
      const pos = geom.attributes.position;
      if (!pos) return;
      mesh.updateWorldMatrix(true, false);
      const e = mesh.matrixWorld.elements;
      let yMin = Infinity, yMax = -Infinity;
      const ys = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const wy = e[1] * x + e[5] * y + e[9] * z + e[13];
        ys[i] = wy;
        if (wy < yMin) yMin = wy;
        if (wy > yMax) yMax = wy;
      }
      const span = Math.max(1e-4, yMax - yMin);
      const colors = new Float32Array(pos.count * 3);
      const tmp = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        let t = (ys[i] - yMin) / span;
        t = Math.pow(t, 0.72);
        sampleHeightColor(t, tmp);
        colors[i * 3] = tmp.r;
        colors[i * 3 + 1] = tmp.g;
        colors[i * 3 + 2] = tmp.b;
      }
      geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 0.88, metalness: 0.02, flatShading: false, side: THREE.FrontSide,
      });
      if (mesh.material && !Array.isArray(mesh.material)) mesh.material.dispose?.();
      mesh.material = mat;
    }

    const riverMat = new THREE.MeshStandardMaterial({
      color: 0x2f7fd0, roughness: 0.28, metalness: 0.08,
      emissive: 0x0a3a6a, emissiveIntensity: 0.45, side: THREE.DoubleSide,
    });
    const lakeMat = new THREE.MeshStandardMaterial({
      color: 0x2a6fb8, roughness: 0.22, metalness: 0.12,
      emissive: 0x0c4a7a, emissiveIntensity: 0.55,
      transparent: true, opacity: 0.92, side: THREE.DoubleSide,
    });

    function lonLatToXZ(lon, lat, bounds, box) {
      const u = (lon - bounds.west) / (bounds.east - bounds.west);
      const v = (lat - bounds.south) / (bounds.north - bounds.south);
      const x = THREE.MathUtils.lerp(box.min.x, box.max.x, u);
      const z = THREE.MathUtils.lerp(box.max.z, box.min.z, v); // north → -Z in glTF
      return { x, z, u, v };
    }

    async function loadHeightGrid() {
      const meta = await (await fetch("./heights_meta.json")).json();
      const buf = await (await fetch("./heights.bin")).arrayBuffer();
      const data = new Float32Array(buf);
      return { meta, data };
    }

    function sampleGrid(grid, lon, lat) {
      const { meta, data } = grid;
      const b = meta.bounds;
      const u = (lon - b.west) / (b.east - b.west);
      const v = (b.north - lat) / (b.north - b.south); // row0 = north
      if (u < 0 || u > 1 || v < 0 || v > 1) return NaN;
      const x = u * (meta.width - 1);
      const y = v * (meta.height - 1);
      const x0 = Math.floor(x), y0 = Math.floor(y);
      const x1 = Math.min(x0 + 1, meta.width - 1);
      const y1 = Math.min(y0 + 1, meta.height - 1);
      const tx = x - x0, ty = y - y0;
      const i = (yy, xx) => data[yy * meta.width + xx];
      const h00 = i(y0, x0), h10 = i(y0, x1), h01 = i(y1, x0), h11 = i(y1, x1);
      if (![h00, h10, h01, h11].every(Number.isFinite)) return NaN;
      const h0 = h00 * (1 - tx) + h10 * tx;
      const h1 = h01 * (1 - tx) + h11 * tx;
      return h0 * (1 - ty) + h1 * ty;
    }

    function elevToWorldY(h, grid, box) {
      const zFloor = grid.meta.z_floor;
      const zMax = grid.meta.z_max || (zFloor + 2200);
      const t = (h - zFloor) / Math.max(1, zMax - zFloor);
      const ySpan = box.max.y - box.min.y;
      return box.min.y + Math.min(1, Math.max(0, t)) * ySpan + ySpan * WATER_LIFT_FRAC;
    }

    function addRiverTube(group, points, radius) {
      if (points.length < 2) return;
      const curve = new THREE.CatmullRomCurve3(points);
      const segs = Math.min(300, Math.max(6, points.length * 2));
      const geo = new THREE.TubeGeometry(curve, segs, radius, 5, false);
      group.add(new THREE.Mesh(geo, riverMat));
    }

    function addLakeMesh(group, points, radius) {
      let pts = points.slice();
      if (pts.length > 2 && pts[0].distanceToSquared(pts[pts.length - 1]) < 1e-4) pts = pts.slice(0, -1);
      if (pts.length < 3) return;
      const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
      const cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
      const cz = pts.reduce((s, p) => s + p.z, 0) / pts.length;
      const n = pts.length;
      const positions = new Float32Array((n + 1) * 3);
      positions[0] = cx; positions[1] = cy; positions[2] = cz;
      for (let i = 0; i < n; i++) {
        positions[(i + 1) * 3] = pts[i].x;
        positions[(i + 1) * 3 + 1] = pts[i].y;
        positions[(i + 1) * 3 + 2] = pts[i].z;
      }
      const indices = [];
      for (let i = 0; i < n; i++) indices.push(0, i + 1, (i + 1) % n + 1);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      group.add(new THREE.Mesh(geo, lakeMat));
      addRiverTube(group, points.concat([points[0]]), radius * 0.55);
    }


    const DISTRICT_LIFT_FRAC = 0.0055;

    async function addDistrictBoundaries(terrainRoot, grid) {
      const data = await (await fetch("./districts.json")).json();
      terrainRoot.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(terrainRoot);
      const bounds = data.bounds || grid.meta.bounds;
      const ySpan = box.max.y - box.min.y;
      const group = new THREE.Group();
      group.name = "DistrictBoundaries";

      const mat = new THREE.LineBasicMaterial({
        color: 0xd6dee8,
        transparent: true,
        opacity: 0.72,
        depthWrite: false,
        fog: true,
      });

      let drawn = 0;
      for (const feat of data.features || []) {
        for (const line of feat.lines || []) {
          if (!line || line.length < 2) continue;
          const pts = [];
          for (const pair of line) {
            const lon = pair[0], lat = pair[1];
            if (![lon, lat].every(Number.isFinite)) continue;
            const h = sampleGrid(grid, lon, lat);
            if (!Number.isFinite(h)) continue;
            const { x, z } = lonLatToXZ(lon, lat, bounds, box);
            const y = elevToWorldY(h, grid, box) + ySpan * DISTRICT_LIFT_FRAC;
            pts.push(new THREE.Vector3(x, y, z));
          }
          if (pts.length < 2) continue;
          const geo = new THREE.BufferGeometry().setFromPoints(pts);
          const obj = new THREE.Line(geo, mat);
          obj.userData = { name: feat.name, adcode: feat.adcode };
          group.add(obj);
          drawn++;
        }
      }
      scene.add(group);
      console.info(`district boundaries: ${drawn} polylines, ${data.features?.length || 0} districts`);
      return group;
    }

    const LABEL_LIFT_FRAC = 0.012;

    function makeLabelEl(name, kind) {
      const el = document.createElement("div");
      el.className = `geo-label ${kind}`;
      el.textContent = name;
      return el;
    }

    async function addLabels(terrainRoot, grid) {
      const data = await (await fetch("./labels.json")).json();
      terrainRoot.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(terrainRoot);
      const bounds = data.bounds || grid.meta.bounds;
      const ySpan = box.max.y - box.min.y;
      const group = new THREE.Group();
      group.name = "GeoLabels";
      let placed = 0;
      for (const lab of data.labels || []) {
        const { lon, lat, name, kind } = lab;
        if (![lon, lat].every(Number.isFinite) || !name) continue;
        let h = sampleGrid(grid, lon, lat);
        if (!Number.isFinite(h)) {
          // soft fallback: slightly inside bounds sample
          h = sampleGrid(grid,
            Math.min(bounds.east - 1e-4, Math.max(bounds.west + 1e-4, lon)),
            Math.min(bounds.north - 1e-4, Math.max(bounds.south + 1e-4, lat)));
        }
        if (!Number.isFinite(h)) continue;
        const { x, z } = lonLatToXZ(lon, lat, bounds, box);
        let y = elevToWorldY(h, grid, box);
        // mountains float a bit higher; districts sit closer to ground
        const boost = kind === "mountain" ? 1.6 : kind === "district" ? 0.7 : 1.0;
        y += ySpan * LABEL_LIFT_FRAC * boost;
        const obj = new CSS2DObject(makeLabelEl(name, kind || "district"));
        obj.position.set(x, y, z);
        obj.userData = { kind, name };
        group.add(obj);
        placed++;
      }
      scene.add(group);
      console.info(`labels placed: ${placed}`);
      return group;
    }

    async function addWaterOverlays(terrainRoot, preloadedGrid) {
      const water = await fetch("./water.json").then((r) => r.json());
      const grid = preloadedGrid || await loadHeightGrid();
      terrainRoot.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(terrainRoot);
      const group = new THREE.Group();
      group.name = "WaterOverlay";
      const span = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
      const baseRadius = Math.max(1.8, span * 0.00125);
      const bounds = water.bounds;

      for (const feat of water.features || []) {
        const coords = feat.coords || [];
        if (coords.length < 2) continue;
        const pts = [];
        for (const [lon, lat] of coords) {
          const h = sampleGrid(grid, lon, lat);
          if (!Number.isFinite(h)) continue;
          const { x, z } = lonLatToXZ(lon, lat, bounds, box);
          const y = elevToWorldY(h, grid, box);
          pts.push(new THREE.Vector3(x, y, z));
        }
        if (feat.kind === "river") {
          if (pts.length >= 2) addRiverTube(group, pts, baseRadius * (feat.name.includes("引水") ? 0.75 : 1.2));
        } else if (pts.length >= 3) {
          addLakeMesh(group, pts, baseRadius * 1.3);
        } else if (pts.length >= 2) {
          addRiverTube(group, pts, baseRadius * 1.4);
        }
      }
      scene.add(group);
    }

    const loader = new GLTFLoader();
    try {
      await MeshoptDecoder.ready;
      loader.setMeshoptDecoder(MeshoptDecoder);
    } catch (e) {
      console.warn("MeshoptDecoder unavailable", e);
    }

    loader.load(
      "./beijing_mountains.glb",
      (gltf) => {
        const root = gltf.scene;
        root.scale.y *= VERTICAL_BOOST;
        root.updateMatrixWorld(true);

        root.traverse((obj) => {
          if (!obj.isMesh) return;
          obj.castShadow = false;
          obj.receiveShadow = false;
          const name = `${obj.name || ""} ${obj.material?.name || ""}`;
          if (/river/i.test(name)) {
            obj.visible = false;
            return;
          }
          applyHeightColors(obj);
        });
        scene.add(root);
        fitCameraToObject(root);
        statusEl.classList.add("hidden");

        // Water + labels after first paint (non-blocking for status)
        (async () => {
          try {
            const grid = await loadHeightGrid();
            await Promise.all([
              addWaterOverlays(root, grid),
              addDistrictBoundaries(root, grid),
              addLabels(root, grid),
            ]);
          } catch (e) {
            console.warn("overlays failed", e);
          }
        })();
      },
      (ev) => {
        if (ev.total > 0) {
          const pct = Math.round((ev.loaded / ev.total) * 100);
          progressEl.style.width = pct + "%";
          statusText.textContent = `正在加载地形… ${pct}%`;
        } else {
          statusText.textContent = `正在加载地形… ${(ev.loaded / 1048576).toFixed(1)} MB`;
        }
      },
      (err) => {
        console.error(err);
        const viaFile = location.protocol === "file:";
        statusText.textContent = viaFile
          ? "加载失败：请用本地 HTTP 打开（不要直接双击文件）"
          : "地形模型加载失败（网络或文件缺失）。请刷新或改用本机服务。";
        progressEl.style.width = "100%";
        progressEl.style.background = "#c44";
      }
    );

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    })();
  </script>
</body>
</html>
